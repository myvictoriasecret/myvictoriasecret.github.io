<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Book Studio</title>
    <!-- นำเข้าไลบรารี pdf-lib ผ่าน CDN -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #4f46e5; color: white; border: none; border-radius: 6px; }
        button:hover { background-color: #4338ca; }
        #toast { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>E-Book Studio Demo</h1>
    <p>คลิกปุ่มด้านล่างเพื่อทดสอบระบบสร้างและโหลดตัวอย่างหนังสือ PDF</p>
    <button onclick="generateAndLoadSamplePdf()">สร้างหนังสือตัวอย่าง</button>
    <div id="toast"></div>

    <script>
        // ฟังก์ชันแจ้งเตือน (Toast notification)
        function showToast(message, type = 'success') {
            const toastEl = document.getElementById('toast');
            toastEl.style.color = type === 'error' ? '#dc2626' : '#16a34a';
            toastEl.textContent = message;
        }

        // ฟังก์ชันจำลองฐานข้อมูลเบื้องต้น (Database mock functions)
        async function saveBookToDB(bookObj) {
            console.log('Saved to DB:', bookObj);
        }

        async function openBook(bookObj) {
            console.log('Opened book:', bookObj);
        }

        async function loadLibraryUI() {
            console.log('Library UI loaded');
        }

        // ฟังก์ชันหลักสำหรับสร้าง PDF
        async function generateAndLoadSamplePdf() {
            try {
                if (!window.PDFLib) {
                    throw new Error('ไม่พบไลบรารี pdf-lib');
                }

                showToast('กำลังสร้างตัวอย่างหนังสือ...');

                const { PDFDocument, StandardFonts, rgb } = PDFLib;
                const pdfDoc = await PDFDocument.create();
                const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
                const boldFont = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

                const pages = [
                    {
                        title: 'E-Book Studio Demo',
                        lines: [
                            'Welcome to your interactive PDF e-book reader!',
                            'Try adding sticky notes or bookmarking pages.'
                        ]
                    },
                    {
                        title: 'Chapter 1: Two-Page Spread',
                        lines: [
                            'This is Page 2 of the sample e-book.',
                            'Notice how two pages appear side by side!'
                        ]
                    },
                    {
                        title: 'Chapter 2: Sticky Notes',
                        lines: [
                            'This is Page 3 of the sample e-book.',
                            'Click on "Add Note" to attach post-its anywhere.'
                        ]
                    }
                ];

                for (const [index, content] of pages.entries()) {
                    const page = pdfDoc.addPage([612, 792]);

                    page.drawText(content.title, {
                        x: 72,
                        y: 700,
                        size: 24,
                        font: boldFont,
                        color: rgb(0.2, 0.25, 0.45)
                    });

                    page.drawText(`Page ${index + 1}`, {
                        x: 72,
                        y: 660,
                        size: 12,
                        font,
                        color: rgb(0.4, 0.4, 0.4)
                    });

                    content.lines.forEach((line, lineIndex) => {
                        page.drawText(line, {
                            x: 72,
                            y: 610 - lineIndex * 24,
                            size: 14,
                            font,
                            color: rgb(0.15, 0.15, 0.15)
                        });
                    });
                }

                const pdfBytes = await pdfDoc.save();
                const bookObj = {
                    id: 'sample_' + Date.now(),
                    name: 'หนังสือตัวอย่าง - E-Book Studio.pdf',
                    size: `${(pdfBytes.byteLength / (1024 * 1024)).toFixed(2)} MB`,
                    date: new Date().toLocaleDateString('th-TH'),
                    data: pdfBytes
                };

                await saveBookToDB(bookObj);
                await openBook(bookObj);
                await loadLibraryUI();
                showToast('สร้างหนังสือตัวอย่างสำเร็จ!');
            } catch (error) {
                console.error(error);
                showToast('สร้างหนังสือตัวอย่างไม่สำเร็จ', 'error');
            }
        }
    </script>
</body>
</html>
